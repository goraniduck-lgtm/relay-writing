<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>릴레이 그리기 진행판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" id="brand">릴레이 그리기</div>
    <button class="classchip" id="classChip" hidden></button>
  </div>
  <main id="app"><div class="panel empty"><h2>연결하는 중</h2><p class="note">잠시만 기다려 주세요.</p></div></main>
</div>
<div id="overlay"></div>

<script>
(function(){
const app = document.getElementById('app'), overlay = document.getElementById('overlay');
document.getElementById('brand').innerHTML = BRAND_SVG + ' 릴레이 그리기';

const urlClass = new URLSearchParams(location.search).get('class');
const S = {
  classes: [], classesLoaded: false, sets: [], setsLoaded: false,
  cid: urlClass || ls.get('rdh-class', null), game: null, gameLoaded: false,
  view: 'auto', reveal: null, modal: null, cfg: null, cfgFor: null, connected: true
};
if (urlClass) ls.set('rdh-class', urlClass);
let gameRef = null, beepedFor = null, wakeLock = null;

const cls = () => S.classes.find(c => c.id === S.cid);

function watchGame(){
  if (gameRef) gameRef.off();
  S.game = null; S.gameLoaded = false; S.reveal = null;
  if (!S.cid) return;
  gameRef = ref('games/' + S.cid);
  gameRef.on('value', s => {
    S.game = normGame(s.val()); S.gameLoaded = true;
    if (S.reveal && !isActive(S.game)) S.reveal = null;
    render();
  }, () => toast('진행 상황을 불러오지 못했어요'));
}
function pickClass(id){
  S.cid = id; ls.set('rdh-class', id); S.view = 'auto'; S.cfgFor = null;
  if (urlClass && id !== urlClass) history.replaceState(null, '', location.pathname);
  watchGame(); render();
}

/* ---------- 저장 ---------- */
function saveGame(g){
  S.game = g; render();
  ref('games/' + S.cid).set(JSON.parse(JSON.stringify(g)))
    .catch(() => toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'));
}
const clone = g => JSON.parse(JSON.stringify(g));
function addLog(g, text){ g.log = [{ t: now(), text }, ...(g.log || [])].slice(0, 40); }

/* ---------- 진행 ---------- */
function ensureCfg(){
  if (S.cfgFor === S.cid && S.cfg) return;
  const c = cls() || {}, g = S.game;
  S.cfg = {
    setId: (g && g.setId) || c.setId || (S.sets[0] && S.sets[0].id) || null,
    groups: (g && g.groups) || c.groups || 6,
    minutes: c.minutes != null ? c.minutes : 10
  };
  S.cfgFor = S.cid;
}
function startGame(){
  const s = S.sets.find(x => x.id === S.cfg.setId); if (!s) return;
  const n = S.cfg.groups, t = now();
  const g = { status: 'running', className: (cls() || {}).name || '', setId: s.id, setName: s.name, words: s.words.slice(),
    mission: s.mission || '모둠원 모두 함께 행동 미션 수행하기', groups: n, progress: Array(n).fill(0), finishedAt: Array(n).fill(0),
    timerSec: S.cfg.minutes * 60, startedAt: t, pausedAt: 0, pausedTotal: 0, endedAt: 0, log: [] };
  addLog(g, `게임 시작 · ${n}모둠 · ${s.name}`);
  S.view = 'auto'; S.reveal = { kind: 'first' }; saveGame(g); grabWake();
}
function advance(gi){
  const g = clone(S.game), T = total(g);
  if (g.finishedAt[gi]) { S.reveal = { kind: 'done', gi, peek: true }; render(); return; }
  if (g.progress[gi] < T - 1) {
    g.progress[gi]++; const idx = g.progress[gi];
    addLog(g, `${gi + 1}모둠 정답 → ${idx === T - 1 ? '행동 미션' : (idx + 1) + '번째 제시어'}`);
    S.reveal = { kind: idx === T - 1 ? 'mission' : 'word', gi, idx };
  } else {
    g.finishedAt[gi] = now();
    addLog(g, `${gi + 1}모둠 미션 성공 · ${g.finishedAt.filter(Boolean).length}등`);
    S.reveal = { kind: 'done', gi };
  }
  saveGame(g);
}
function undo(){
  const r = S.reveal; if (!r) return;
  const g = clone(S.game);
  if ((r.kind === 'word' || r.kind === 'mission') && g.progress[r.gi] === r.idx && !g.finishedAt[r.gi]) {
    g.progress[r.gi]--; addLog(g, `${r.gi + 1}모둠 되돌림 → ${g.progress[r.gi] + 1}번째`);
  } else if (r.kind === 'done') { g.finishedAt[r.gi] = 0; addLog(g, `${r.gi + 1}모둠 미션 완료 취소`); }
  S.reveal = null; saveGame(g);
}
function peek(gi){
  const g = S.game;
  if (g.finishedAt[gi]) S.reveal = { kind: 'done', gi, peek: true };
  else { const idx = g.progress[gi]; S.reveal = { kind: idx === total(g) - 1 ? 'mission' : 'word', gi, idx, peek: true }; }
  render();
}
function togglePause(){
  const g = clone(S.game), t = now();
  if (g.status === 'running') { g.status = 'paused'; g.pausedAt = t; addLog(g, '일시정지'); }
  else if (g.status === 'paused') { g.pausedTotal += t - g.pausedAt; g.pausedAt = 0; g.status = 'running'; addLog(g, '다시 시작'); }
  saveGame(g);
}
function endGame(){
  const g = clone(S.game), t = now();
  if (g.pausedAt) { g.pausedTotal += t - g.pausedAt; g.pausedAt = 0; }
  g.status = 'ended'; g.endedAt = t; addLog(g, '게임 종료'); S.modal = null; saveGame(g);
}

/* ---------- 소리·화면 꺼짐 방지 ---------- */
function beep(){ try { const C = window.AudioContext || window.webkitAudioContext; const a = new C(); [0, .35, .7].forEach(t => { const o = a.createOscillator(), v = a.createGain(); o.frequency.value = 880; o.connect(v); v.connect(a.destination); v.gain.setValueAtTime(.25, a.currentTime + t); v.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); }); } catch(e){} }
async function grabWake(){ try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && isActive(S.game)) grabWake(); });

/* ---------- 화면 ---------- */
function render(){
  const chip = document.getElementById('classChip'), c = cls();
  chip.hidden = !c; if (c) chip.innerHTML = `${esc(c.name)} <span>반 바꾸기</span>`;
  if (!S.classesLoaded) return;
  if (!c) { if (S.cid) { S.cid = null; ls.set('rdh-class', null); watchGame(); } renderPick(); overlay.innerHTML = ''; return; }
  if (!S.gameLoaded || !S.setsLoaded) { app.innerHTML = `<div class="panel empty"><h2>불러오는 중</h2></div>`; return; }
  if (S.view === 'setup' || !S.game || (!isActive(S.game) && S.game.status !== 'ended')) renderSetup();
  else renderBoard();
  renderOverlay();
}
function renderPick(){
  const list = S.classes.map(c => `<button class="classbtn" data-pick="${esc(c.id)}"><b>${esc(c.name)}</b><span class="note">이 반 진행하기</span></button>`).join('');
  app.innerHTML = `<section class="panel"><h2>어느 반을 진행하나요?</h2>
    ${S.classes.length ? `<div class="classgrid">${list}</div>` : `<div class="empty"><h2>아직 반이 없어요</h2><p class="note">선생님이 반을 만들면 여기에 나타나요.</p></div>`}</section>`;
}
function renderSetup(){
  ensureCfg();
  const cfg = S.cfg, resumable = isActive(S.game);
  if (!S.sets.find(s => s.id === cfg.setId) && S.sets[0]) cfg.setId = S.sets[0].id;
  const list = S.sets.length ? S.sets.map(s => `<button class="setopt" role="radio" aria-checked="${s.id === cfg.setId}" data-set="${esc(s.id)}"><span class="nm">${esc(s.name)}</span><span class="ct">제시어 ${s.words.length}개 + 미션</span></button>`).join('')
    : `<div class="empty"><h2>제시어 세트가 없어요</h2><p class="note">선생님이 세트를 넣으면 나타나요.</p></div>`;
  app.innerHTML = `
  ${resumable ? `<div class="banner"><span>진행 중인 게임이 있어요 · ${esc(S.game.setName)} · ${S.game.groups}모둠</span><button class="btn" data-act="resume">이어서 진행</button></div>` : ''}
  <div class="setup">
    <section class="panel"><h2>제시어 세트</h2><div class="setlist" role="radiogroup" aria-label="제시어 세트">${list}</div></section>
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="panel"><span class="label">모둠 수</span>
        <div class="stepper"><button data-step="groups:-1" aria-label="모둠 줄이기">−</button><span class="val">${cfg.groups}모둠</span><button data-step="groups:1" aria-label="모둠 늘리기">+</button></div></section>
      <section class="panel"><span class="label">제한 시간</span>
        <div class="stepper"><button data-step="minutes:-1" aria-label="1분 줄이기">−</button><span class="val">${cfg.minutes ? cfg.minutes + '분' : '없음'}</span><button data-step="minutes:1" aria-label="1분 늘리기">+</button></div>
        <div class="chips">${[0, 5, 10, 15, 20].map(m => `<button data-min="${m}">${m ? m + '분' : '제한 없음'}</button>`).join('')}</div></section>
      <button class="btn primary startbtn" data-act="start" ${S.sets.find(s => s.id === cfg.setId) ? '' : 'disabled'}>시작</button>
      ${resumable ? `<p class="note">시작을 누르면 진행 중인 게임은 새 게임으로 바뀌어요.</p>` : ''}
    </div>
  </div>`;
}
function renderBoard(){
  const g = S.game, ci = clockInfo(g), T = total(g), ended = g.status === 'ended';
  const cards = Array.from({ length: g.groups }, (_, i) => {
    const p = g.progress[i], fin = !!g.finishedAt[i], onM = !fin && p === T - 1;
    const sub = fin ? `<span class="rank">${rankOf(g, i)}등 · 미션 성공</span>` : onM ? `<span class="mtag">행동 미션 중</span>` : `<span class="gsub">맞히면 눌러 다음 제시어</span>`;
    return `<div class="gcard ${fin ? 'done' : onM ? 'mission' : ''}" style="--gc:${gcolor(i)}">
      <button class="gmain" data-adv="${i}" ${ended ? 'disabled' : ''} aria-label="${i + 1}모둠 ${fin ? '완료' : onM ? '미션 완료 처리' : '정답, 다음 제시어 보기'}">
        <span class="gname"><span class="dot"></span>${i + 1}모둠</span>
        <span class="gnum">${onM || fin ? '미션' : (p + 1)}<small>${onM || fin ? '' : ' / ' + (T - 1) + '번째'}</small></span>
        <span class="bar"><i style="width:${Math.round(((fin ? T : p) / T) * 100)}%"></i></span>${sub}
      </button>${ended ? '' : `<button class="peek" data-peek="${i}">다시 보기</button>`}</div>`;
  }).join('');
  app.innerHTML = `
  <div class="timerbar">
    <span class="clock ${ci.cls}" data-clock-for="me" data-base="clock">${ci.text}</span>
    <div class="meta"><b>${esc(g.setName)}</b><span class="note">${STATUS[g.status]} · ${g.timerSec ? '제한 ' + g.timerSec / 60 + '분' : '시간 제한 없음'}${ci.over ? ' · 시간 종료!' : ''}</span></div>
    <div class="acts">${ended ? `<button class="btn primary" data-act="new">새 게임</button>` : `
      <button class="btn" data-act="first">첫 제시어</button>
      <button class="btn" data-act="pause">${g.status === 'paused' ? '다시 시작' : '일시정지'}</button>
      <button class="btn danger" data-act="askend">끝내기</button>`}</div>
  </div>
  <div class="grid">${cards}</div>
  <p class="note">모둠원이 정답을 작게 말하면 그 모둠 버튼을 누르세요. 행동 미션 중인 모둠 버튼을 누르면 미션 성공으로 기록돼요.</p>`;
}
function renderOverlay(){
  let h = '';
  const g = S.game, r = S.reveal;
  if (r && g) {
    const ci = clockInfo(g), clock = `<span class="rv-clock" data-clock-for="me" data-base="rv-clock">${ci.text}</span>`;
    if (r.kind === 'first') {
      h = `<div class="reveal"><div class="rv-top"><div class="rv-who">모든 모둠 첫 순서</div>${clock}</div>
      <div class="rv-body"><span class="rv-kicker">첫 번째 제시어</span><div class="rv-word">${esc(g.words[0])}</div></div>
      <div class="rv-acts"><button class="btn primary rv-back" data-act="close">돌아가기</button></div></div>`;
    } else {
      const done = r.kind === 'done', mis = r.kind === 'mission';
      const kicker = done ? `${rankOf(g, r.gi) || ''}등으로 미션 성공!` : mis ? '마지막 행동 미션 · 모둠원 모두 함께' : `${r.idx + 1}번째 제시어`;
      h = `<div class="reveal ${done ? 'done' : mis ? 'mission' : ''}" style="--gc:${gcolor(r.gi)}">
      <div class="rv-top"><div class="rv-who"><span class="dot"></span>${r.gi + 1}모둠</div>${clock}</div>
      <div class="rv-body"><span class="rv-kicker">${kicker}</span><div class="rv-word">${done ? '완주!' : esc(itemText(g, r.idx))}</div></div>
      <div class="rv-acts"><button class="btn primary rv-back" data-act="close">돌아가기</button>
      ${r.peek ? '' : `<button class="btn ghost rv-undo" data-act="undo">잘못 눌렀어요 · 되돌리기</button>`}</div></div>`;
    }
  }
  if (S.modal === 'end') h += `<div class="modal"><div class="panel"><h2>게임을 끝낼까요?</h2><p class="note">타이머가 멈추고 모둠 버튼을 더 누를 수 없어요.</p>
    <div class="row"><button class="btn" data-act="cancel">계속 진행</button><button class="btn danger" data-act="end">끝내기</button></div></div></div>`;
  overlay.innerHTML = h;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'classChip') { S.cid = null; ls.set('rdh-class', null); watchGame(); S.gameLoaded = true; render(); return; }
  if (b.dataset.pick) { pickClass(b.dataset.pick); return; }
  if (b.dataset.set) { S.cfg.setId = b.dataset.set; render(); return; }
  if (b.dataset.step) { const [k, d] = b.dataset.step.split(':'); if (k === 'groups') S.cfg.groups = Math.min(12, Math.max(2, S.cfg.groups + +d)); else S.cfg.minutes = Math.min(60, Math.max(0, S.cfg.minutes + +d)); render(); return; }
  if (b.dataset.min != null) { S.cfg.minutes = +b.dataset.min; render(); return; }
  if (b.dataset.adv != null) { advance(+b.dataset.adv); return; }
  if (b.dataset.peek != null) { peek(+b.dataset.peek); return; }
  const a = b.dataset.act;
  if (a === 'start') startGame();
  else if (a === 'resume') { S.view = 'auto'; render(); }
  else if (a === 'close') { S.reveal = null; render(); }
  else if (a === 'undo') undo();
  else if (a === 'first') { S.reveal = { kind: 'first' }; render(); }
  else if (a === 'pause') togglePause();
  else if (a === 'askend') { S.modal = 'end'; render(); }
  else if (a === 'end') endGame();
  else if (a === 'cancel') { S.modal = null; render(); }
  else if (a === 'new') { S.view = 'setup'; S.cfgFor = null; render(); }
});

startClocks(id => S.game, () => {
  const g = S.game; if (!isActive(g)) return;
  const ci = clockInfo(g);
  if (ci.over && beepedFor !== g.startedAt) { beepedFor = g.startedAt; beep(); render(); }
});

/* ---------- 연결 ---------- */
ensureAnon().then(() => {
  ref('classes').on('value', s => { S.classes = listOf(s.val()); S.classesLoaded = true; render(); },
    () => { app.innerHTML = `<div class="panel empty"><h2>연결할 수 없어요</h2><p class="note">인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`; });
  ref('sets').on('value', s => { S.sets = listOf(s.val()).map(normSet); S.setsLoaded = true; render(); });
  watchGame();
}).catch(() => {
  app.innerHTML = `<div class="panel empty"><h2>연결할 수 없어요</h2><p class="note">인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`;
});
})();
</script>
</body>
</html>
