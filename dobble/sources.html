<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출처 모음 · 딱! 같은 그림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
<style>
body{-webkit-user-select:text;user-select:text}
.page{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
.top a.back{display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.intro{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.intro p{color:var(--soft)}
.kogl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.kogl div{display:flex;gap:10px;align-items:center;font-size:15px}
.kt{flex:none;font-family:var(--jua);font-size:15px;padding:3px 10px;border-radius:999px;background:var(--bg2);border:1.5px solid var(--line)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.lk{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);text-decoration:none;color:var(--ink)}
.lk:active{background:var(--bg2)}
.lk .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg2)}
.lk b{display:block;font-family:var(--jua);font-weight:400;font-size:19px}
.lk small{color:var(--soft);font-size:13px}
.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.filter input{flex:1;min-width:200px;font-size:17px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:none}
.filter input:focus{border-color:var(--ink)}
.filter .chip{font-size:16px;padding:8px 14px}
.count{color:var(--soft);font-size:15px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.it{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.it img{width:96px;height:96px;object-fit:contain;border-radius:12px;background:var(--bg)}
.it h4{font-family:var(--jua);font-weight:400;font-size:21px;line-height:1.2}
.it .ch{font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--bg2);color:var(--ink)}
.tag.k{background:#E3ECFF;color:#1F4FB8}
.acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.acts a{font-size:14px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;background:#fff}
.acts a.go{background:var(--ink);color:#fff;border-color:var(--ink)}
details{grid-column:1 / -1;font-size:13px;color:var(--soft)}
details summary{cursor:pointer}
details dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin-top:6px;word-break:break-all}
details dt{color:var(--ink)}
.note{color:var(--soft);font-size:15px;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 16px}
section{margin-top:26px}
section > h3{color:var(--ink);font-size:24px;margin:0 0 10px}
</style>
</head>
<body>
<div class="page">
  <header class="top"><a class="back" href="./" aria-label="게임으로 돌아가기">←</a><h2>출처 모음</h2></header>

  <div class="intro">
    <p>게임에 나오는 지역 캐릭터 그림은 각 지자체가 <b>공공누리</b>로 공개한 그림이에요. 누가 만들었는지(출처)를 밝히고, 수업에서만 써요. 그림은 고치지 않고 크기만 줄였어요.</p>
    <div class="kogl" id="kogl"></div>
  </div>

  <section>
    <h3>함께 찾아보기</h3>
    <div class="links">
      <a class="lk" href="https://korean.visitkorea.or.kr/" target="_blank" rel="noopener"><span class="ic">🗺️</span><span><b>대한민국 구석구석</b><small>우리나라 여행지·축제·먹거리 찾기</small></span></a>
      <a class="lk" href="https://www.kogl.or.kr/" target="_blank" rel="noopener"><span class="ic">📂</span><span><b>공공누리</b><small>나라와 지자체가 공개한 그림·자료</small></span></a>
      <a class="lk" href="https://www.kogl.or.kr/info/license.do" target="_blank" rel="noopener"><span class="ic">ⓘ</span><span><b>공공누리 유형 알아보기</b><small>1~4유형 이용 조건 안내</small></span></a>
    </div>
  </section>

  <div id="sets"></div>

  <section>
    <h3>이모지 그림 세트</h3>
    <p class="note" id="emojiNote"></p>
  </section>
</div>

<script src="sets.js?v=5"></script>
<script src="sets-region.js?v=3"></script>
<script>
'use strict';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KOGL = {
  1: { t: '출처표시', kid: '출처를 밝히면 쓸 수 있어요' },
  2: { t: '출처표시 + 상업적 이용금지', kid: '출처를 밝히고, 돈 버는 데는 쓰지 않아요' },
  3: { t: '출처표시 + 변경금지', kid: '출처를 밝히고, 그림을 고치지 않아요' },
  4: { t: '출처표시 + 상업적 이용금지 + 변경금지', kid: '출처를 밝히고, 돈 버는 데 쓰지 않고, 고치지 않아요' }
};
document.getElementById('kogl').innerHTML = Object.entries(KOGL).map(([k, v]) => `<div><span class="kt">${k}유형</span><span>${esc(v.kid)}</span></div>`).join('');
const visit = org => 'https://korean.visitkorea.or.kr/search/search_list.do?keyword=' + encodeURIComponent(org.split(' ').pop());
const linkOf = (u, label, cls) => u ? `<a class="${cls || ''}" href="${esc(u)}" target="_blank" rel="noopener">${esc(label)}</a>` : '';

const credited = SETS.filter(s => s.symbols.some(x => x.src));
const box = document.getElementById('sets');
credited.forEach((set, si) => {
  const cats = [...new Set(set.symbols.map(x => x.src && x.src.cat).filter(Boolean))];
  const sec = document.createElement('section');
  sec.innerHTML = `<h3>${esc(set.name)}</h3>
    <div class="filter"><input type="search" placeholder="지역이나 캐릭터 이름" aria-label="지역이나 캐릭터 이름으로 찾기">
      <button class="chip on" data-cat="">전체</button>${cats.map(c => `<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <p class="count"></p><div class="grid"></div>
    ${set.symbols.some(x => !x.src && x.visit) ? `<h3 style="font-size:20px;margin:18px 0 8px">그림 없이 낱말로 나오는 지역 자랑거리</h3>
    <div class="links">${set.symbols.filter(x => !x.src && x.visit).map(x => `<a class="lk" href="${esc('https://korean.visitkorea.or.kr/search/search_list.do?keyword=' + encodeURIComponent(x.visit))}" target="_blank" rel="noopener"><span class="ic">🔎</span><span><b>${esc(x.w)}</b><small>${esc(x.note)} · 구석구석에서 찾아보기</small></span></a>`).join('')}</div>` : ''}`;
  box.appendChild(sec);
  const grid = sec.querySelector('.grid'), input = sec.querySelector('input'), count = sec.querySelector('.count');
  let cat = '';
  const items = set.symbols.filter(x => x.src).slice().sort((a, b) => a.src.org.localeCompare(b.src.org, 'ko'));
  function draw() {
    const q = input.value.trim();
    const shown = items.filter(x => (!cat || x.src.cat === cat) && (!q || (x.src.org + x.src.char + x.src.feat + (x.w || '')).includes(q)));
    count.textContent = `${shown.length}개 / 전체 ${items.length}개`;
    grid.innerHTML = shown.map(x => {
      const s = x.src, k = KOGL[s.kogl] || { t: '' };
      const pageLabel = /kogl\.or\.kr/.test(s.page) ? '출처 · 공공누리' : '출처 · 지자체 누리집';
      return `<article class="it">
        <img src="${esc(x.img)}" alt="${esc(s.org)} 캐릭터 ${esc(s.char)}" loading="lazy">
        <div><h4>${esc(s.org)}</h4><div class="ch">캐릭터 <b>${esc(s.char)}</b></div>
          <div class="tags"><span class="tag">${esc(s.feat)}</span><span class="tag">${esc(s.cat)}</span><span class="tag k" title="${esc(k.t)}">공공누리 ${esc(s.kogl)}유형</span></div></div>
        <div class="acts">${linkOf(visit(s.org), '구석구석에서 찾아보기', 'go')}${linkOf(s.page, pageLabel)}${linkOf(s.extra, '추가 근거')}${linkOf(s.file, '그림 파일')}</div>
        <details><summary>자세한 출처 정보</summary><dl>
          <dt>지자체</dt><dd>${esc(s.org)}</dd>
          ${s.title ? `<dt>자료 이름</dt><dd>${esc(s.title)}</dd>` : ''}
          <dt>공공누리</dt><dd>${esc(s.kogl)}유형 (${esc(k.t)})</dd>
          <dt>자료 종류</dt><dd>${esc(s.kind)}</dd>
          <dt>변환</dt><dd>${esc(s.conv)}</dd>
          <dt>확인한 날</dt><dd>${esc(s.date)}</dd>
        </dl></details>
      </article>`;
    }).join('') || '<p class="note">찾는 지역이 없어요.</p>';
  }
  input.addEventListener('input', draw);
  sec.querySelector('.filter').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    cat = b.dataset.cat; sec.querySelectorAll('[data-cat]').forEach(x => x.classList.toggle('on', x === b)); draw();
  });
  draw();
});
const emojiSets = SETS.filter(s => !s.symbols.some(x => x.img)).map(s => s.name);
document.getElementById('emojiNote').textContent = `${emojiSets.join(', ')} 세트는 따로 그림 파일 없이, 태블릿에 들어 있는 이모지 글꼴로 그림을 보여 줘요.`;
</script>
</body>
</html>
